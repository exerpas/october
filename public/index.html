<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>October — Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #08080a;
            color: #f4f4f5;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        .font-mono-brand {
            font-family: 'JetBrains Mono', monospace;
        }
        input, textarea {
            user-select: text;
            -webkit-user-select: text;
        }
        .neon-box {
            background: rgba(12, 12, 16, 0.88);
            border: 1px solid rgba(168, 85, 247, 0.35);
            box-shadow: 0 0 45px -5px rgba(168, 85, 247, 0.28), 0 25px 50px -12px rgba(0, 0, 0, 0.95);
        }
        #crypto-rain-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .crypto-icon {
            position: absolute;
            top: -80px;
            color: #c084fc;
            filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.8)) drop-shadow(0 0 18px rgba(168, 85, 247, 0.4));
            opacity: 0.25;
            animation: fall-down linear infinite;
        }
        @keyframes fall-down {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            15% { opacity: 0.35; }
            85% { opacity: 0.35; }
            100% { transform: translateY(115vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center antialiased selection:bg-purple-950 selection:text-purple-200 relative">
    
    <div id="crypto-rain-container"></div>

    <main class="w-full max-w-md px-6 relative z-10">
        <div class="text-center mb-8">
            <h1 class="font-mono-brand text-sm font-semibold tracking-[0.45em] text-zinc-300">OCTOBER</h1>
        </div>

        <div class="neon-box rounded-3xl p-9 backdrop-blur-2xl">
            <div class="mb-8 text-center">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-zinc-900 border border-zinc-800 text-zinc-300 mb-4 shadow-inner">
                    <svg class="w-6 h-6 text-purple-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z"></path>
                    </svg>
                </div>
                <p class="text-sm text-zinc-400">Enter your license key to continue</p>
            </div>

            <div class="space-y-5">
                <div>
                    <label for="keyInput" class="block text-xs font-mono-brand uppercase tracking-wider text-zinc-400 mb-2.5">License Key</label>
                    <input type="text" id="keyInput" placeholder="OCTOBER-XXXX-XXXXXXXXXXXX" class="w-full bg-zinc-900/90 border border-zinc-800 rounded-2xl px-4 py-3.5 text-xs font-mono-brand text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-purple-500/60 focus:ring-1 focus:ring-purple-500/60 transition-all">
                </div>
                <p id="errorMsg" class="text-xs text-rose-400 hidden text-center"></p>
                <button id="submitBtn" class="w-full bg-zinc-100 hover:bg-white text-zinc-950 font-medium text-sm py-3.5 rounded-2xl transition-all duration-200 shadow-lg shadow-purple-500/10 active:scale-[0.99]">
                    Access
                </button>
            </div>
        </div>
    </main>

    <script>
        const cryptoSVGs = [
            `<svg class="w-full h-full" viewBox="0 0 24 24" fill="currentColor"><path d="M23.638 14.904c-1.602 6.43-8.113 10.34-14.542 8.736C2.67 22.05-1.24 15.538.362 9.11 1.962 2.67 8.475-1.24 14.902.362c6.43 1.605 10.342 8.115 8.736 14.542zM15.706 9.873c.257-1.72-1.054-2.646-2.846-3.262l.582-2.334-1.422-.355-.567 2.272c-.373-.093-.757-.18-1.138-.266l.57-2.285-1.423-.355-.582 2.333c-.31-.07-.614-.14-.908-.214l.002-.007-1.963-.49-.378 1.52s1.056.242 1.034.257c.577.144.68.526.663.829l-.665 2.668c.04.01.09.025.147.048l-.15-.037-.932 3.738c-.07.174-.249.436-.652.336.015.021-1.035-.258-1.035-.258l-.707 1.63 1.852.462c.345.086.683.177 1.018.263l-.588 2.361 1.422.355.582-2.332c.388.106.764.204 1.134.297l-.58 2.324 1.423.355.588-2.357c2.428.46 4.255.274 5.023-1.92.62-1.767-.03-2.787-1.306-3.45.928-.214 1.627-.825 1.814-2.088zm-3.245 4.56c-.44 1.772-3.418.814-4.385.572l.782-3.136c.967.242 4.053.722 3.603 2.564zm.441-4.582c-.402 1.61-2.883.792-3.687.592l.71-2.845c.804.2 3.385.575 2.977 2.253z"/></svg>`,
            `<svg class="w-full h-full" viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 17.97L4.58 13.62 11.943 24l7.37-10.38-7.372 4.35h.003zM12.056 0L4.69 12.223l7.365 4.354 7.365-4.35L12.056 0z"/></svg>`,
            `<svg class="w-full h-full" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 10 10A10.011 10.011 0 0 0 12 2zm1 14.93v1.07h-2v-1.07a3.5 3.5 0 0 1-2.81-2.82l1.94-.4a1.6 1.6 0 0 0 1.37 1.29c.8.09 1.5-.32 1.5-1 0-.6-.42-.94-1.63-1.27-1.88-.51-2.87-1.26-2.87-2.73 0-1.47 1.05-2.58 2.5-2.88V6h2v1.07a3.5 3.5 0 0 1 2.53 2.57l-1.92.42a1.61 1.61 0 0 0-1.28-1.12c-.73-.08-1.33.35-1.33.93 0 .54.38.83 1.56 1.15 1.88.52 2.94 1.25 2.94 2.85 0 1.55-1.12 2.68-2.5 2.99z"/></svg>`,
            `<svg class="w-full h-full" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0a12 12 0 1 0 12 12A12.003 12.003 0 0 0 12 0zm-1.22 5.093h2.302l-1.928 7.234 2.33-.787-.492 1.838-2.336.791-1.026 3.841h7.822l-.76 2.89H6.101l3.678-13.807z"/></svg>`
        ];

        const container = document.getElementById('crypto-rain-container');
        for (let i = 0; i < 32; i++) {
            const el = document.createElement('div');
            el.className = 'crypto-icon';
            el.innerHTML = cryptoSVGs[Math.floor(Math.random() * cryptoSVGs.length)];
            const size = Math.floor(Math.random() * 20) + 24;
            el.style.width = `${size}px`;
            el.style.height = `${size}px`;
            el.style.left = `${(i * (100 / 32))}%`;
            el.style.animationDuration = `${Math.random() * 10 + 9}s`;
            el.style.animationDelay = `-${Math.random() * 14}s`;
            container.appendChild(el);
        }

        const submitBtn = document.getElementById('submitBtn');
        const keyInput = document.getElementById('keyInput');
        const errorMsg = document.getElementById('errorMsg');

        submitBtn.addEventListener('click', async () => {
            const key = keyInput.value.trim();
            errorMsg.classList.add('hidden');

            if (!key) {
                errorMsg.innerText = 'Please enter a license key.';
                errorMsg.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch('/api/verify-key', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('october_active_session', JSON.stringify({
                        key: data.key,
                        duration: data.duration,
                        loginTime: Date.now()
                    }));
                    window.location.href = '/dashboard.html';
                } else {
                    errorMsg.innerText = data.error || 'Invalid or revoked license key.';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.innerText = 'Connection error with server.';
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
