<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>October — Admin Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #08080a;
            color: #f4f4f5;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }
        .font-mono-brand {
            font-family: 'JetBrains Mono', monospace;
        }
        input, textarea, select {
            user-select: text;
            -webkit-user-select: text;
        }
        .neon-box {
            background: rgba(12, 12, 16, 0.9);
            border: 1px solid rgba(168, 85, 247, 0.35);
            box-shadow: 0 0 45px -5px rgba(168, 85, 247, 0.28), 0 25px 50px -12px rgba(0, 0, 0, 0.95);
        }

        /* Lluvia de Criptomonedas Neón */
        #crypto-rain-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .crypto-icon {
            position: absolute;
            top: -80px;
            color: #c084fc;
            filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.8)) drop-shadow(0 0 18px rgba(168, 85, 247, 0.4));
            opacity: 0.25;
            animation: fall-down linear infinite;
        }
        @keyframes fall-down {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 0.35;
            }
            85% {
                opacity: 0.35;
            }
            100% {
                transform: translateY(115vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center antialiased selection:bg-purple-950 selection:text-purple-200 relative py-12 px-4">
    
    <!-- Contenedor de la lluvia de monedas neón -->
    <div id="crypto-rain-container"></div>

    <main class="w-full max-w-4xl relative z-10 space-y-6">
        <!-- Marca superior -->
        <div class="text-center mb-6">
            <h1 class="font-mono-brand text-sm font-semibold tracking-[0.45em] text-zinc-300">OCTOBER</h1>
            <p class="text-xs font-mono-brand text-purple-400/80 uppercase tracking-widest mt-1">Management Dashboard</p>
        </div>

        <!-- Tarjeta de Login Admin -->
        <div id="authCard" class="neon-box rounded-3xl p-8 backdrop-blur-2xl max-w-md mx-auto">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-zinc-900 border border-zinc-800 text-zinc-300 mb-3 shadow-inner">
                    <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"></path>
                    </svg>
                </div>
                <h2 class="text-base font-medium text-zinc-100">Administrator Access</h2>
                <p class="text-xs text-zinc-400 mt-1">Enter your admin key to authorize session</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-mono-brand uppercase tracking-wider text-zinc-400 mb-2">Admin Secret Key</label>
                    <input type="password" id="adminKeyInput" placeholder="Enter ADMIN_KEY" class="w-full bg-zinc-900/90 border border-zinc-800 rounded-2xl px-4 py-3 text-xs font-mono-brand text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-purple-500/60 transition-all">
                </div>
                <button id="loginAdminBtn" class="w-full bg-zinc-100 hover:bg-white text-zinc-950 font-medium text-xs py-3 rounded-2xl transition-all duration-200 shadow-lg shadow-purple-500/10 active:scale-[0.99]">
                    Authorize Session
                </button>
            </div>
        </div>

        <!-- Panel de Control Principal -->
        <div id="dashboardSection" class="hidden space-y-6">
            
            <!-- Generador de Keys Profesional -->
            <div class="neon-box rounded-3xl p-8 backdrop-blur-2xl">
                <h3 class="text-xs font-mono-brand uppercase tracking-wider text-purple-400 mb-4 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-purple-500 inline-block animate-pulse"></span>
                    License Key Generator
                </h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-[10px] font-mono-brand uppercase text-zinc-400 mb-2">Duration Tier</label>
                        <select id="durationSelect" class="w-full bg-zinc-900/90 border border-zinc-800 rounded-xl px-3.5 py-3 text-xs font-mono-brand text-zinc-100 focus:outline-none focus:border-purple-500/60">
                            <option value="1">1 Day</option>
                            <option value="7">7 Days</option>
                            <option value="30" selected>1 Month (30 Days)</option>
                            <option value="lifetime">Lifetime</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-mono-brand uppercase text-zinc-400 mb-2">Max Uses</label>
                        <input type="number" id="usesInput" value="1" min="1" class="w-full bg-zinc-900/90 border border-zinc-800 rounded-xl px-3.5 py-3 text-xs font-mono-brand text-zinc-100 focus:outline-none focus:border-purple-500/60">
                    </div>
                </div>
                <button id="generateBtn" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-medium text-xs py-3 rounded-xl transition-all shadow-lg shadow-purple-600/20 active:scale-[0.99]">
                    Generate License Key
                </button>

                <!-- Resultado de Key Creada -->
                <div id="keyResult" class="hidden mt-4 p-4 rounded-xl bg-purple-950/40 border border-purple-500/30 text-center">
                    <p class="text-[10px] font-mono-brand uppercase text-purple-300 mb-1">New Key Created Successfully</p>
                    <code id="generatedKeyText" class="font-mono-brand text-sm font-semibold text-purple-200 select-all block py-1"></code>
                </div>
            </div>

            <!-- Listado y Gestión de Llaves Activas -->
            <div class="neon-box rounded-3xl p-8 backdrop-blur-2xl">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-xs font-mono-brand uppercase tracking-wider text-zinc-300 flex items-center gap-2">
                        <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"></path>
                        </svg>
                        Active & Managed License Keys
                    </h3>
                    <button id="refreshTableBtn" class="text-[10px] font-mono-brand text-purple-400 hover:text-purple-300 uppercase tracking-wider transition-colors">
                        [ Refresh List ]
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-zinc-800 text-[10px] font-mono-brand uppercase text-zinc-500">
                                <th class="py-3 px-3">Key</th>
                                <th class="py-3 px-3">Created</th>
                                <th class="py-3 px-3">Duration</th>
                                <th class="py-3 px-3">Status</th>
                                <th class="py-3 px-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="keysTableBody" class="font-mono-brand text-xs divide-y divide-zinc-900/60">
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        const cryptoSVGs = [
            `<svg class="w-full h-full" viewBox="0 0 24 24" fill="currentColor"><path d="M23.638 14.904c-1.602 6.43-8.113 10.34-14.542 8.736C2.67 22.05-1.24 15.538.362 9.11 1.962 2.67 8.475-1.24 14.902.362c6.43 1.605 10.342 8.115 8.736 14.542zM15.706 9.873c.257-1.72-1.054-2.646-2.846-3.262l.582-2.334-1.422-.355-.567 2.272c-.373-.093-.757-.18-1.138-.266l.57-2.285-1.423-.355-.582 2.333c-.31-.07-.614-.14-.908-.214l.002-.007-1.963-.49-.378 1.52s1.056.242 1.034.257c.577.144.68.526.663.829l-.665 2.668c.04.01.09.025.147.048l-.15-.037-.932 3.738c-.07.174-.249.436-.652.336.015.021-1.035-.258-1.035-.258l-.707 1.63 1.852.462c.345.086.683.177 1.018.263l-.588 2.361 1.422.355.582-2.332c.388.106.764.204 1.134.297l-.58 2.324 1.423.355.588-2.357c2.428.46 4.255.274 5.023-1.92.62-1.767-.03-2.787-1.306-3.45.928-.214 1.627-.825 1.814-2.088zm-3.245 4.56c-.44 1.772-3.418.814-4.385.572l.782-3.136c.967.242 4.053.722 3.603 2.564zm.441-4.582c-.402 1.61-2.883.792-3.687.592l.71-2.845c.804.2 3.385.575 2.977 2.253z"/></svg>`,
            `<svg class="w-full h-full" viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 17.97L4.58 13.62 11.943 24l7.37-10.38-7.372 4.35h.003zM12.056 0L4.69 12.223l7.365 4.354 7.365-4.35L12.056 0z"/></svg>`,
            `<svg class="w-full h-full" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 10 10A10.011 10.011 0 0 0 12 2zm1 14.93v1.07h-2v-1.07a3.5 3.5 0 0 1-2.81-2.82l1.94-.4a1.6 1.6 0 0 0 1.37 1.29c.8.09 1.5-.32 1.5-1 0-.6-.42-.94-1.63-1.27-1.88-.51-2.87-1.26-2.87-2.73 0-1.47 1.05-2.58 2.5-2.88V6h2v1.07a3.5 3.5 0 0 1 2.53 2.57l-1.92.42a1.61 1.61 0 0 0-1.28-1.12c-.73-.08-1.33.35-1.33.93 0 .54.38.83 1.56 1.15 1.88.52 2.94 1.25 2.94 2.85 0 1.55-1.12 2.68-2.5 2.99z"/></svg>`,
            `<svg class="w-full h-full" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0a12 12 0 1 0 12 12A12.003 12.003 0 0 0 12 0zm-1.22 5.093h2.302l-1.928 7.234 2.33-.787-.492 1.838-2.336.791-1.026 3.841h7.822l-.76 2.89H6.101l3.678-13.807z"/></svg>`
        ];

        const container = document.getElementById('crypto-rain-container');
        const totalIcons = 32;
        for (let i = 0; i < totalIcons; i++) {
            const el = document.createElement('div');
            el.className = 'crypto-icon';
            el.innerHTML = cryptoSVGs[Math.floor(Math.random() * cryptoSVGs.length)];
            const size = Math.floor(Math.random() * 20) + 24;
            const colWidth = 100 / totalIcons;
            const posX = (i * colWidth) + (Math.random() * colWidth * 0.8);
            const duration = Math.random() * 10 + 9;
            const delay = Math.random() * 14;

            el.style.width = `${size}px`;
            el.style.height = `${size}px`;
            el.style.left = `${posX}%`;
            el.style.animationDuration = `${duration}s`;
            el.style.animationDelay = `-${delay}s`;
            container.appendChild(el);
        }

        const authCard = document.getElementById('authCard');
        const dashboardSection = document.getElementById('dashboardSection');
        const keysTableBody = document.getElementById('keysTableBody');

        document.getElementById('loginAdminBtn').addEventListener('click', () => {
            const val = document.getElementById('adminKeyInput').value.trim();
            if (val !== '') {
                authCard.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                fetchKeys();
            } else {
                alert('Please enter your Admin Key.');
            }
        });

        async function fetchKeys() {
            try {
                const res = await fetch('/api/keys');
                const keys = await res.json();
                renderTable(keys);
            } catch (err) {
                console.error('Error fetching keys:', err);
            }
        }

        function renderTable(keys) {
            keysTableBody.innerHTML = '';
            if (keys.length === 0) {
                keysTableBody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-zinc-600">No keys found.</td></tr>`;
                return;
            }

            keys.forEach(item => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-zinc-900/40 transition-colors';
                
                let statusBadge = item.status === 'Active' 
                    ? '<span class="px-2 py-0.5 rounded-full bg-emerald-950/60 text-emerald-400 border border-emerald-500/30 text-[10px]">Active</span>'
                    : '<span class="px-2 py-0.5 rounded-full bg-rose-950/60 text-rose-400 border border-rose-500/30 text-[10px]">Disabled</span>';

                row.innerHTML = `
                    <td class="py-3 px-3 text-zinc-200 select-all font-semibold">${item.key}</td>
                    <td class="py-3 px-3 text-zinc-400 text-[11px]">${item.created}</td>
                    <td class="py-3 px-3 text-purple-300 text-[11px]">${item.duration}</td>
                    <td class="py-3 px-3">${statusBadge}</td>
                    <td class="py-3 px-3 text-right space-x-2">
                        <button onclick="toggleKey(${item.id})" class="text-[10px] uppercase px-2 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 transition-colors">
                            ${item.status === 'Active' ? 'Turn Off' : 'Reactivate'}
                        </button>
                        <button onclick="deleteKey(${item.id})" class="text-[10px] uppercase px-2 py-1 rounded bg-rose-950/50 hover:bg-rose-900 text-rose-300 border border-rose-500/30 transition-colors">
                            Delete
                        </button>
                    </td>
                `;
                keysTableBody.appendChild(row);
            });
        }

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const duration = document.getElementById('durationSelect').value;

            try {
                const res = await fetch('/api/keys', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ duration })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('generatedKeyText').innerText = data.key.key;
                    document.getElementById('keyResult').classList.remove('hidden');
                    fetchKeys();
                }
            } catch (err) {
                console.error('Error generating key:', err);
            }
        });

        window.toggleKey = async function(id) {
            await fetch('/api/keys/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            fetchKeys();
        };

        window.deleteKey = async function(id) {
            await fetch('/api/keys/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            fetchKeys();
        };

        document.getElementById('refreshTableBtn').addEventListener('click', () => {
            fetchKeys();
        });
    </script>
</body>
</html>
